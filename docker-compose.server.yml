services:
  sbi-api:
    build:
      context: .
      dockerfile: Dockerfile.prod
    env_file: .env
    restart: unless-stopped
    volumes:
      - sbi_data:/srv/uploads
      - ./data/dashboards:/srv/data/dashboards
      - ./data/instad:/srv/data/instad:ro
    networks:
      - caddy_net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # mizanbi-client : frontend React standalone.
  # Décommenter quand le choix frontend est arrêté (mizanbi-client vs frontend/).
  # Build : docker compose -f docker-compose.server.yml build mizanbi-client
  # Passer VITE_API_BASE=https://sovereignbi-api.147-5-126-188.sslip.io pour pointer sur l'API Oracle.
  #
  # mizanbi-client:
  #   build:
  #     context: ./mizanbi-client
  #     args:
  #       VITE_API_BASE: "https://sovereignbi-api.147-5-126-188.sslip.io"
  #   restart: unless-stopped
  #   networks:
  #     - caddy_net

networks:
  caddy_net:
    external: true
    name: code-route-dj_default

volumes:
  sbi_data:
