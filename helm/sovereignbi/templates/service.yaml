apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sovereignbi
  labels:
    app: sovereignbi
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8000
      protocol: TCP
  selector:
    app: sovereignbi
    release: {{ .Release.Name }}
