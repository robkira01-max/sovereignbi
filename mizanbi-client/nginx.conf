# Redirection HTTP → HTTPS (désactivée en développement local)
# Décommenter en production derrière Caddy ou un reverse proxy TLS.
# server {
#     listen 80;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Cache long pour les assets Vite (hash dans le nom de fichier)
    location ~* \.(js|css|woff2?|png|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SVG : cache court (favicons, og-image peuvent changer)
    location ~* \.svg$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # sitemap.xml et robots.txt : pas de cache agressif
    location ~* \.(xml|txt)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # SPA fallback : toute route inconnue → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS activé uniquement derrière TLS (Caddy gère le TLS en prod)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
}
