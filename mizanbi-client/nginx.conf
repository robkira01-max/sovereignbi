# Redirection HTTP → HTTPS (désactivée en développement local)
# Décommenter en production derrière Caddy ou un reverse proxy TLS.
# server {
#     listen 80;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Assets Vite : le hash est dans le nom de fichier, donc cache long immuable
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Manifeste : type MIME explicite (absent de la table par défaut de nginx)
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Images de marque, favicons, manifeste, glyphes de cartes : noms non hachés, cache court
    location ~* \.(png|ico|svg|webmanifest|pbf)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # robots.txt : pas de cache agressif
    location ~* \.txt$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # L'application n'a pas de routes côté client (navigation par état) : toute URL inconnue
    # renvoie un vrai 404 (pas de « soft 404 » qui renverrait index.html avec un code 200).
    location / {
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Application privée : ne pas indexer (en plus de la balise meta robots)
    add_header X-Robots-Tag "noindex, nofollow" always;

    # En-têtes de sécurité
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS activé uniquement derrière TLS (Caddy gère le TLS en prod)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
}
