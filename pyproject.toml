[project]
name = "sovereignbi"
version = "0.1.0"
description = "BI conversationnelle souveraine, 100 % locale"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",          # API HTTP (MIT)
  "uvicorn[standard]>=0.30", # serveur ASGI (BSD)
  "python-multipart>=0.0.9", # upload de fichiers
  "httpx>=0.27",             # client HTTP vers Ollama local (BSD)
  "duckdb>=1.0",             # moteur SQL embarqué (MIT)
  "pandas>=2.2",             # lecture Excel/CSV (BSD)
  "openpyxl>=3.1",           # lecture .xlsx (MIT)
  "xlrd>=2.0",               # lecture .xls legacy (BSD)
  "psycopg2-binary>=2.9",    # connecteur PostgreSQL (LGPL — usage dynamique, non embarqué)
  "sqlglot>=25.0",           # parsing/validation SQL (MIT)
  "langgraph>=0.2",          # orchestration du pipeline (MIT)
  "pyyaml>=6.0",             # modèle sémantique
  "qdrant-client>=1.9",      # store vectoriel in-memory (Apache 2.0)
  "scikit-learn>=1.4",       # TF-IDF fallback embedder (BSD)
  "sentence-transformers>=3.0", # BGE-M3 embedder (Apache 2.0)
  "streamlit>=1.35",           # UI web (Apache 2.0)
  "plotly>=5.0",               # graphiques (MIT)
  "fpdf2>=2.7",                # export PDF (MIT)
  "pymysql>=1.1",              # connecteur MySQL (MIT)
  "pymssql>=2.3",              # connecteur SQL Server (FreeTDS/LGPL — driver dynamique)
  "pypdf>=4.0",                # extraction texte PDF (MIT)
  "python-docx>=1.1",          # extraction texte DOCX (MIT)
  "structlog>=24.0",           # logs structurés (MIT/Apache 2.0)
  "cryptography>=42.0",        # Fernet AES-128-CBC+HMAC pour le coffre credentials (Apache 2.0)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]
