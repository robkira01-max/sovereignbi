name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ruff
        run: pip install ruff
      - name: Ruff lint
        run: ruff check app/ tools/ tests/
      - name: py_compile
        run: |
          find app/ tools/ tests/ -name '*.py' | xargs -I{} python -m py_compile {}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -c constraints.txt -e ".[dev]" pip-audit
      - name: pip-audit (zero known CVEs)
        run: pip-audit
      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/integration

  client-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mizanbi-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mizanbi-client/package-lock.json
      - name: Install
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Vitest
        run: npm test
      - name: Build (Vite)
        run: npm run build
      - name: Docker build (smoke test)
        run: docker build --build-arg VITE_API_BASE="" -t mizanbi-client:ci . 2>&1 | tail -3
        continue-on-error: true
