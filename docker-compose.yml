services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    networks: [internal]          # aucun accès Internet
    # GPU NVIDIA (décommenter si disponible) :
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  api:
    build: .
    environment:
      OLLAMA_URL: http://ollama:11434
      LLM_MODEL: qwen2.5-coder:32b
    ports: ["8000:8000"]
    depends_on: [ollama]
    networks: [internal, exposed]
    # NB : "exposed" est nécessaire pour publier le port. Le code n'émet aucun appel
    # sortant ; au sprint 6, ajouter une règle de pare-feu hôte pour le prouver.

networks:
  internal:
    internal: true
  exposed: {}

volumes:
  ollama_models:

# Premier démarrage (machine connectée, une seule fois) :
#   docker compose up -d ollama && docker compose exec ollama ollama pull qwen2.5-coder:32b
# Ensuite l'installation fonctionne hors ligne.
